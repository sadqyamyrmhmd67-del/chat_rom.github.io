<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>دوز آنلاین</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0"></script>
<style>
:root {
    --bg: #1a1613; --panel: #252019; --cell: #3d342a;
    --cell-hover: #4a3f33; --line: #5c4f3f; --text: #e8dfd0;
    --muted: #9a8d7a; --gold: #c9a961; --gold-dim: #8a7548;
    --red: #c94c4c; --blue: #5a8fc7; --green: #7ba05b;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
    font-family: Tahoma, system-ui, sans-serif;
    background: var(--bg); color: var(--text);
    margin: 0; padding: 16px; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
}
#app { width: 100%; max-width: 420px; }
#lobby { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 20px; }
#profile-card {
    background: rgba(0,0,0,0.2); border: 1px solid var(--line);
    border-radius: 4px; padding: 14px; margin-bottom: 18px;
}
#profile-title {
    font-family: Georgia, serif; color: var(--gold); font-size: 16px;
    margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid var(--line);
}
.id-display {
    font-size: 11px; color: var(--muted); margin-bottom: 10px;
    font-family: monospace; direction: ltr; text-align: right;
}
.id-display span { color: var(--gold); }
.name-label { font-size: 12px; color: var(--muted); margin-bottom: 5px; display: block; }
.name-row { display: flex; gap: 6px; }
#name-input {
    flex: 1; padding: 9px 12px; border-radius: 3px;
    border: 1px solid var(--line); background: var(--cell);
    color: var(--text); font-family: inherit; font-size: 13px; outline: none;
}
#name-input:focus { border-color: var(--gold-dim); }
#save-name {
    padding: 9px 16px; border-radius: 3px; border: 1px solid var(--gold);
    background: var(--gold); color: #1a1613; font-weight: 700;
    font-size: 12px; cursor: pointer;
}
#save-name:disabled { opacity: 0.5; }
#name-status { margin-top: 8px; font-size: 11px; min-height: 14px; color: var(--muted); }
#name-status.ok { color: var(--green); }
#name-status.err { color: var(--red); }
.divider {
    height: 1px; background: linear-gradient(90deg, transparent, var(--gold-dim), transparent);
    margin: 16px 0; opacity: 0.5;
}
.size-label {
    font-family: Georgia, serif; font-size: 13px; color: var(--gold);
    margin-bottom: 10px; display: block; text-align: center;
}
.size-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 18px; }
.size-btn {
    background: var(--cell); border: 1px solid var(--line); color: var(--text);
    border-radius: 3px; padding: 10px 4px; font-size: 13px; font-weight: 600;
    cursor: pointer; font-family: Georgia, serif;
}
.size-btn.active { background: var(--gold); border-color: var(--gold); color: #1a1613; }
.btn-primary {
    width: 100%; padding: 14px; font-size: 14px; font-weight: 600;
    color: #1a1613; background: var(--gold); border: 1px solid var(--gold);
    border-radius: 4px; cursor: pointer;
}
.btn-primary:disabled { background: #4a3f33; border-color: #4a3f33; color: var(--muted); }
#status { margin-top: 14px; color: var(--muted); font-size: 12px; text-align: center; min-height: 18px; }
#game { display: none; }
.players-bar {
    display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px;
    margin-bottom: 12px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 4px; padding: 10px 8px;
}
.player { text-align: center; padding: 4px; border-radius: 3px; }
.player.active { background: rgba(201,169,97,0.08); }
.player-name {
    font-family: Georgia, serif; font-size: 12px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; font-weight: 600;
}
.player-name.me-x { color: var(--red); }
.player-name.me-o { color: var(--blue); }
.vs-mark { display: flex; align-items: center; color: var(--gold-dim); font-size: 12px; font-weight: 700; }
#status-text {
    text-align: center; font-family: Georgia, serif; font-size: 14px;
    min-height: 22px; margin-bottom: 12px; color: var(--muted);
}
#status-text.my-turn { color: var(--green); }
#status-text.win { color: var(--green); font-size: 18px; font-weight: 700; }
#status-text.lose { color: var(--red); font-size: 18px; font-weight: 700; }
#status-text.draw { color: var(--gold); font-size: 18px; font-weight: 700; }
.board-wrap {
    background: #2f2820; border: 2px solid var(--line);
    border-radius: 6px; padding: 8px; margin-bottom: 14px;
}
.board {
    display: grid; gap: 3px; aspect-ratio: 1; --n: 3;
    grid-template-columns: repeat(var(--n), 1fr);
    grid-template-rows: repeat(var(--n), 1fr);
}
.cell {
    background: var(--cell); border: 1px solid rgba(0,0,0,0.2);
    border-radius: 3px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; user-select: none; font-weight: 700;
    font-family: Georgia, serif;
    font-size: calc(min(84vw, 380px) / var(--n) * 0.55);
    color: transparent; transition: background 0.15s;
}
.cell:hover:not(.taken) { background: var(--cell-hover); }
.cell.taken { cursor: default; }
.cell.x { color: var(--red); }
.cell.o { color: var(--blue); }
.cell.winner { background: rgba(123,160,91,0.25); box-shadow: inset 0 0 0 1px var(--green); }
#chat { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
#chat-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px; border-bottom: 1px solid var(--line);
    font-family: Georgia, serif; font-size: 13px; color: var(--gold);
    background: rgba(0,0,0,0.15);
}
#lock-btn {
    background: var(--cell); border: 1px solid var(--line); color: var(--text);
    border-radius: 3px; padding: 5px 12px; font-size: 12px; cursor: pointer;
}
#lock-btn.locked { background: rgba(201,76,76,0.15); border-color: var(--red); color: #e8a0a0; }
#lock-btn.other-locked { background: rgba(201,169,97,0.15); border-color: var(--gold-dim); color: var(--gold); }
#chat-messages {
    height: 120px; overflow-y: auto; padding: 10px 12px;
    display: flex; flex-direction: column; gap: 6px;
}
.msg { max-width: 78%; padding: 7px 12px; border-radius: 4px; font-size: 13px; word-wrap: break-word; }
.msg.me { background: var(--gold-dim); align-self: flex-end; }
.msg.opp { background: var(--cell); align-self: flex-start; }
.msg.sys { color: var(--muted); font-size: 11px; align-self: center; font-style: italic; }
#chat-input-row { display: flex; gap: 6px; padding: 8px; border-top: 1px solid var(--line); }
#chat-input {
    flex: 1; padding: 10px 12px; border-radius: 3px;
    border: 1px solid var(--line); background: var(--cell);
    color: var(--text); font-family: inherit; font-size: 13px; outline: none;
}
#chat-input:disabled { opacity: 0.4; }
#send-btn {
    padding: 10px 16px; border-radius: 3px; border: 1px solid var(--gold);
    background: var(--gold); color: #1a1613; font-weight: 700; font-size: 13px; cursor: pointer;
}
#send-btn:disabled { opacity: 0.4; }
#restart-btn {
    width: 100%; margin-top: 12px; padding: 14px; border-radius: 4px;
    border: 1px solid var(--green); background: rgba(123,160,91,0.15);
    color: #a8d18a; font-weight: 600; font-size: 14px; cursor: pointer;
}
</style>
</head>
<body>
<div id="app">

<div id="lobby">
    <div id="profile-card">
        <div id="profile-title">پروفایل</div>
        <div class="id-display">شناسه: <span id="id-display">...</span></div>
        <label class="name-label">نام نمایشی</label>
        <div class="name-row">
            <input type="text" id="name-input" maxlength="20" placeholder="نام خود را وارد کنید">
            <button id="save-name">ثبت</button>
        </div>
        <p id="name-status"></p>
    </div>
    <div class="divider"></div>
    <label class="size-label">ابعاد صفحه</label>
    <div class="size-grid" id="size-grid"></div>
    <button class="btn-primary" id="find-btn" disabled>در حال آماده‌سازی...</button>
    <p id="status">لطفاً صبر کنید</p>
</div>

<div id="game">
    <div class="players-bar">
        <div class="player" id="me-player"><div class="player-name" id="me-name">من</div></div>
        <div class="vs-mark">VS</div>
        <div class="player" id="opp-player"><div class="player-name" id="opp-name">حریف</div></div>
    </div>
    <div id="status-text"></div>
    <div class="board-wrap"><div class="board" id="board"></div></div>
    <div id="chat">
        <div id="chat-header">
            <span>چت</span>
            <button id="lock-btn">باز</button>
        </div>
        <div id="chat-messages"></div>
        <div id="chat-input-row">
            <input type="text" id="chat-input" placeholder="پیام..." maxlength="200">
            <button id="send-btn">ارسال</button>
        </div>
    </div>
    <button id="restart-btn" style="display:none">بازی جدید</button>
</div>
</div>

<script>
// ============================================
// اتصال به Supabase
// ============================================
const SUPABASE_URL = 'https://plpkixgydnsilujlwizi.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_-obcx5r6P_a4PmxF6_dikw_XIoW6OYQ';

const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ============================================
// وضعیت بازی
// ============================================
const state = {
    myId: null,
    myName: null,
    oppId: null,
    oppName: 'حریف',
    boardSize: 3,
    board: [],
    currentPlayer: 'X',
    mySymbol: null,
    active: false,
    started: false,
    roomId: null,
    chatLocked: false,
    iLocked: false,
    lastMsgTime: 0
};

let lobbyChannel = null;
let gameChannel = null;

const $ = id => document.getElementById(id);
const lobbyEl = $('lobby'), gameEl = $('game');
const sizeGrid = $('size-grid'), findBtn = $('find-btn');
const statusEl = $('status'), boardEl = $('board'), statusText = $('status-text');
const chatMsgs = $('chat-messages'), chatInput = $('chat-input'), sendBtn = $('send-btn');
const lockBtn = $('lock-btn'), restartBtn = $('restart-btn');
const idDisplay = $('id-display'), nameInput = $('name-input');
const saveName = $('save-name'), nameStatus = $('name-status');
const meName = $('me-name'), oppName = $('opp-name');
const mePlayer = $('me-player'), oppPlayer = $('opp-player');

const toFa = n => String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
const clean = t => String(t).replace(/[<>"']/g, '').slice(0, 200);

// ============================================
// راه‌اندازی
// ============================================
async function init() {
    // ساخت شناسه UUID امن
    state.myId = crypto.randomUUID();
    
    // تلاش برای ورود ناشناس
    try {
        const { data, error } = await sb.auth.signInAnonymously();
        if (!error && data && data.user) {
            state.myId = data.user.id;
            console.log('✓ Auth OK');
        } else {
            console.log('✗ Auth failed:', error ? error.message : 'unknown');
        }
    } catch (e) {
        console.log('✗ Auth error:', e);
    }
    
    idDisplay.textContent = state.myId.slice(0, 8);
    
    // بازیابی نام از حافظه
    const saved = localStorage.getItem('myName');
    if (saved) {
        state.myName = saved;
        nameInput.value = saved;
        meName.textContent = saved;
        nameStatus.textContent = '✓ نام ذخیره شده';
        nameStatus.className = 'ok';
    }
    
    findBtn.disabled = false;
    findBtn.textContent = 'جستجوی حریف';
    statusEl.textContent = 'آماده';
}

init();

// ============================================
// ثبت نام (چک تکراری)
// ============================================
saveName.addEventListener('click', async () => {
    const name = clean(nameInput.value.trim());
    
    if (!name || name.length < 2) {
        nameStatus.textContent = 'نام باید حداقل ۲ حرف باشد';
        nameStatus.className = 'err';
        return;
    }
    
    if (state.myName === name) {
        nameStatus.textContent = '✓ همین نام برای شما ثبت شده';
        nameStatus.className = 'ok';
        return;
    }
    
    saveName.disabled = true;
    nameStatus.textContent = 'در حال بررسی...';
    nameStatus.className = '';
    
    // چک تکراری بودن از دیتابیس
    let isDuplicate = false;
    try {
        const { data, error } = await sb
            .from('profiles')
            .select('id, username')
            .eq('username', name);
        
        if (error) {
            console.log('Check error:', error.message);
        } else if (data && data.length > 0) {
            // اگه همین اسم برای شخص دیگه‌ای ثبت شده
            const otherId = data[0].id;
            if (otherId !== state.myId) {
                isDuplicate = true;
            }
        }
    } catch (e) {
        console.log('Check exception:', e);
    }
    
    if (isDuplicate) {
        nameStatus.textContent = '✗ این نام قبلاً توسط شخص دیگری ثبت شده، نام دیگری انتخاب کنید';
        nameStatus.className = 'err';
        saveName.disabled = false;
        return;
    }
    
    // ذخیره در دیتابیس
    let saved = false;
    try {
        const { error } = await sb
            .from('profiles')
            .upsert({ id: state.myId, username: name }, { onConflict: 'id' });
        
        if (!error) {
            saved = true;
        } else if (error.code === '23505') {
            // خطای unique violation
            nameStatus.textContent = '✗ این نام قبلاً توسط شخص دیگری ثبت شده، نام دیگری انتخاب کنید';
            nameStatus.className = 'err';
            saveName.disabled = false;
            return;
        } else {
            console.log('Save error:', error.message);
        }
    } catch (e) {
        console.log('Save exception:', e);
    }
    
    // موفق
    state.myName = name;
    localStorage.setItem('myName', name);
    meName.textContent = name;
    nameStatus.textContent = saved ? '✓ نام با موفقیت ثبت شد' : '✓ نام ذخیره شد (آفلاین)';
    nameStatus.className = 'ok';
    saveName.disabled = false;
});

// ============================================
// انتخاب ابعاد
// ============================================
[3, 4, 5, 6, 7, 8, 9, 10].forEach(n => {
    const b = document.createElement('button');
    b.className = 'size-btn' + (n === 3 ? ' active' : '');
    b.textContent = toFa(n) + '×' + toFa(n);
    b.addEventListener('click', () => {
        document.querySelectorAll('.size-btn').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        state.boardSize = n;
    });
    sizeGrid.appendChild(b);
});

// ============================================
// جستجوی حریف
// ============================================
findBtn.addEventListener('click', async () => {
    if (state.started) return;
    
    // اجبار به ثبت نام
    if (!state.myName || state.myName.length < 2) {
        statusEl.textContent = '❌ اول نام خود را ثبت کنید';
        statusEl.style.color = '#c94c4c';
        nameInput.focus();
        nameInput.style.borderColor = '#c94c4c';
        setTimeout(() => {
            nameInput.style.borderColor = '';
            statusEl.style.color = '';
        }, 2500);
        return;
    }
    
    findBtn.disabled = true;
    statusEl.textContent = 'در حال جستجو...';
    
    lobbyChannel = sb.channel('lobby-v6', { config: { broadcast: { self: false } } });
    
    lobbyChannel
        .on('broadcast', { event: 'looking' }, ({ payload }) => {
            if (payload.id === state.myId || state.started) return;
            
            const ids = [state.myId, payload.id].sort();
            const room = 'r_' + ids[0].slice(0, 8) + '_' + ids[1].slice(0, 8);
            
            lobbyChannel.send({
                type: 'broadcast',
                event: 'room',
                payload: {
                    room: room,
                    creator: state.myId,
                    size: state.boardSize,
                    creatorName: state.myName,
                    joinerName: payload.name
                }
            });
            
            enterGame(room, payload.id, state.boardSize, payload.name, state.myName);
        })
        .on('broadcast', { event: 'room' }, ({ payload }) => {
            if (state.started || payload.creator === state.myId) return;
            enterGame(payload.room, payload.creator, payload.size, payload.creatorName, payload.joinerName);
        })
        .subscribe(status => {
            if (status === 'SUBSCRIBED') {
                lobbyChannel.send({
                    type: 'broadcast',
                    event: 'looking',
                    payload: { id: state.myId, name: state.myName }
                });
            }
        });
});

// ============================================
// ورود به بازی
// ============================================
function enterGame(room, oppId, size, oppNameFinal, myNameFinal) {
    if (state.started) return;
    state.started = true;
    state.roomId = room;
    state.oppId = oppId;
    state.boardSize = size;
    state.mySymbol = (state.myId < oppId) ? 'X' : 'O';
    state.oppName = oppNameFinal || 'کاربر';
    
    if (lobbyChannel) {
        lobbyChannel.unsubscribe();
        lobbyChannel = null;
    }
    
    lobbyEl.style.display = 'none';
    gameEl.style.display = 'block';
    
    meName.textContent = state.myName || myNameFinal || 'شما';
    meName.className = 'player-name ' + (state.mySymbol === 'X' ? 'me-x' : 'me-o');
    oppName.textContent = state.oppName;
    
    buildBoard();
    setupGameChannel();
    resetGame();
    addSysMsg('حریف پیدا شد');
}

function buildBoard() {
    boardEl.innerHTML = '';
    boardEl.style.setProperty('--n', state.boardSize);
    const total = state.boardSize * state.boardSize;
    for (let i = 0; i < total; i++) {
        const c = document.createElement('div');
        c.className = 'cell';
        c.addEventListener('click', () => onCellClick(i));
        boardEl.appendChild(c);
    }
}

// ============================================
// کانال بازی
// ============================================
function setupGameChannel() {
    gameChannel = sb.channel('g_' + state.roomId, { config: { broadcast: { self: false } } });
    
    gameChannel
        .on('broadcast', { event: 'move' }, ({ payload }) => {
            // ضد تقلب: چک‌های سختگیرانه
            if (payload.symbol === state.mySymbol) return;
            if (!state.active) return;
            if (state.board[payload.i] !== null) return;
            if (state.currentPlayer !== payload.symbol) return;
            if (payload.i < 0 || payload.i >= state.board.length) return;
            applyMove(payload.i, payload.symbol);
        })
        .on('broadcast', { event: 'chat' }, ({ payload }) => {
            if (payload.text) addMsg(clean(payload.text), 'opp');
        })
        .on('broadcast', { event: 'lock' }, () => {
            state.chatLocked = true;
            state.iLocked = false;
            updateLockUI();
            addSysMsg('🔒 چت توسط حریف قفل شد');
        })
        .on('broadcast', { event: 'unlock' }, () => {
            state.chatLocked = false;
            state.iLocked = false;
            updateLockUI();
            addSysMsg('🔓 چت باز شد');
        })
        .on('broadcast', { event: 'restart' }, () => {
            resetGame();
            addSysMsg('🔄 بازی جدید');
        })
        .subscribe();
}

// ============================================
// کلیک روی خانه (✅ فوری!)
// ============================================
function onCellClick(i) {
    if (!state.active) return;
    if (state.board[i] !== null) return;
    if (state.currentPlayer !== state.mySymbol) return;
    if (i < 0 || i >= state.board.length) return;
    
    // ۱. فوری حرکت رو اعمال کن
    applyMove(i, state.mySymbol);
    
    // ۲. فوری به حریف بفرست
    gameChannel.send({
        type: 'broadcast',
        event: 'move',
        payload: { i: i, symbol: state.mySymbol }
    });
    
    // ۳. در پس‌زمینه توی دیتابیس ذخیره کن (بدون انتظار)
    sb.from('moves').insert({
        game_id: state.roomId,
        cell_index: i,
        player_id: state.myId,
        symbol: state.mySymbol
    }).then(({ error }) => {
        if (error) console.log('DB log:', error.message);
    });
}

// ============================================
// اعمال حرکت
// ============================================
function applyMove(i, symbol) {
    if (state.board[i] !== null) return;
    
    state.board[i] = symbol;
    const cell = boardEl.children[i];
    cell.textContent = symbol;
    cell.classList.add('taken', symbol.toLowerCase());
    
    // چک برنده
    const result = checkWinner();
    if (result) {
        state.active = false;
        if (result === 'draw') {
            statusText.textContent = '🤝 مساوی';
            statusText.className = 'draw';
        } else {
            highlightWin(result.line);
            if (result.winner === state.mySymbol) {
                statusText.textContent = '🎉 برنده شدید';
                statusText.className = 'win';
            } else {
                statusText.textContent = '😢 باختید';
                statusText.className = 'lose';
            }
        }
        restartBtn.style.display = 'block';
        return;
    }
    
    // تغییر نوبت
    state.currentPlayer = (state.currentPlayer === 'X') ? 'O' : 'X';
    updateTurnUI();
}

// ============================================
// تشخیص برنده
// ============================================
function checkWinner() {
    const n = state.boardSize;
    const need = (n === 3) ? 3 : 4;
    const b = state.board;
    
    for (let r = 0; r < n; r++) {
        for (let c = 0; c < n; c++) {
            const i = r * n + c;
            const sym = b[i];
            if (!sym) continue;
            
            for (const [dr, dc] of [[0,1],[1,0],[1,1],[1,-1]]) {
                const line = [i];
                for (let k = 1; k < need; k++) {
                    const nr = r + dr * k, nc = c + dc * k;
                    if (nr < 0 || nr >= n || nc < 0 || nc >= n) break;
                    if (b[nr * n + nc] !== sym) break;
                    line.push(nr * n + nc);
                }
                if (line.length >= need) {
                    return { winner: sym, line: line };
                }
            }
        }
    }
    
    return b.every(x => x) ? 'draw' : null;
}

function highlightWin(line) {
    line.forEach(i => boardEl.children[i].classList.add('winner'));
}

function updateTurnUI() {
    if (!state.active) return;
    
    mePlayer.classList.toggle('active', state.currentPlayer === state.mySymbol);
    oppPlayer.classList.toggle('active', state.currentPlayer !== state.mySymbol);
    
    if (state.currentPlayer === state.mySymbol) {
        statusText.textContent = '✋ نوبت شماست';
        statusText.className = 'my-turn';
    } else {
        statusText.textContent = '⏳ نوبت حریف';
        statusText.className = '';
    }
}

// ============================================
// ریست
// ============================================
restartBtn.addEventListener('click', () => {
    if (gameChannel) {
        gameChannel.send({ type: 'broadcast', event: 'restart' });
    }
    resetGame();
});

function resetGame() {
    const total = state.boardSize * state.boardSize;
    state.board = Array(total).fill(null);
    state.currentPlayer = 'X';
    state.active = true;
    state.chatLocked = false;
    state.iLocked = false;
    
    restartBtn.style.display = 'none';
    statusText.textContent = '';
    statusText.className = '';
    
    [...boardEl.children].forEach(c => {
        c.textContent = '';
        c.className = 'cell';
    });
    
    chatMsgs.innerHTML = '';
    updateLockUI();
    updateTurnUI();
}

// ============================================
// چت
// ============================================
function addMsg(text, who) {
    const d = document.createElement('div');
    d.className = 'msg ' + who;
    d.textContent = text;
    chatMsgs.appendChild(d);
    chatMsgs.scrollTop = chatMsgs.scrollHeight;
    while (chatMsgs.children.length > 100) chatMsgs.removeChild(chatMsgs.firstChild);
}

function addSysMsg(text) {
    const d = document.createElement('div');
    d.className = 'msg sys';
    d.textContent = text;
    chatMsgs.appendChild(d);
    chatMsgs.scrollTop = chatMsgs.scrollHeight;
}

function sendChat() {
    const t = clean(chatInput.value.trim());
    if (!t || state.chatLocked || !gameChannel) return;
    
    // Rate limit: 500ms بین پیام‌ها
    const now = Date.now();
    if (now - state.lastMsgTime < 500) return;
    state.lastMsgTime = now;
    
    addMsg(t, 'me');
    gameChannel.send({ type: 'broadcast', event: 'chat', payload: { text: t } });
    chatInput.value = '';
    chatInput.focus();
}

sendBtn.addEventListener('click', sendChat);
chatInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
        e.preventDefault();
        sendChat();
    }
});

// ============================================
// قفل چت
// ============================================
lockBtn.addEventListener('click', () => {
    if (!gameChannel) return;
    
    if (!state.chatLocked) {
        state.chatLocked = true;
        state.iLocked = true;
        gameChannel.send({ type: 'broadcast', event: 'lock' });
        addSysMsg('🔒 شما چت را قفل کردید');
        updateLockUI();
    } else if (state.iLocked) {
        state.chatLocked = false;
        state.iLocked = false;
        gameChannel.send({ type: 'broadcast', event: 'unlock' });
        addSysMsg('🔓 شما چت را باز کردید');
        updateLockUI();
    }
});

function updateLockUI() {
    if (!state.chatLocked) {
        lockBtn.textContent = 'باز';
        lockBtn.className = '';
        chatInput.disabled = false;
        sendBtn.disabled = false;
    } else if (state.iLocked) {
        lockBtn.textContent = 'قفل (کلیک=باز)';
        lockBtn.className = 'locked';
        chatInput.disabled = true;
        sendBtn.disabled = true;
    } else {
        lockBtn.textContent = 'قفل توسط حریف';
        lockBtn.className = 'other-locked';
        chatInput.disabled = true;
        sendBtn.disabled = true;
    }
}
</script>
</body>
