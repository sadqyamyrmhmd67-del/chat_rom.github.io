<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بازی دوز آنلاین</title>
    <!-- نکته مهم: از نسخه 2.39.0 استفاده کن که پایدارتر است -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0"></script>
    <style>
        body { font-family: Tahoma, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #1a1a2e; color: #eee; }
        h1 { color: #e94560; }
        #lobby, #game { display: none; text-align: center; }
        #lobby { display: block; }
        button { padding: 12px 24px; font-size: 18px; cursor: pointer; background: #0f3460; color: #fff; border: none; border-radius: 8px; margin-top: 20px; }
        button:hover { background: #16213e; }
        button:disabled { background: #555; cursor: not-allowed; }
        #status { margin-top: 15px; color: #aaa; }
        .board { display: grid; grid-template-columns: repeat(3, 100px); grid-template-rows: repeat(3, 100px); gap: 8px; background: #16213e; padding: 10px; border-radius: 12px; margin: 20px 0; }
        .cell { background: #0f3460; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 50px; font-weight: bold; cursor: pointer; user-select: none; transition: 0.2s; }
        .cell:hover { background: #1a1a4e; }
        .cell.x { color: #e94560; }
        .cell.o { color: #4ecdc4; }
        #game-status { font-size: 20px; margin-bottom: 10px; height: 30px; }
        #turn-indicator { margin-bottom: 10px; color: #aaa; }
    </style>
</head>
<body>
    <h1>🎮 دوز آنلاین</h1>

    <div id="lobby">
        <p>برای پیدا کردن حریف، روی دکمه زیر کلیک کن:</p>
        <button id="find-match-btn">جستجوی حریف</button>
        <p id="status">وضعیت: آماده</p>
    </div>

    <div id="game">
        <div id="game-status"></div>
        <div id="turn-indicator"></div>
        <div class="board" id="board"></div>
        <button id="restart-btn" style="display:none;">بازی جدید</button>
    </div>

    <script>
        // ==========================================
        // تنظیمات Supabase (این دو مقدار را تغییر دهید)
        // ==========================================
        const SUPABASE_URL = 'آدرس_پروژه_خود_را_اینجا_بگذارید';
        const SUPABASE_ANON_KEY = 'کلید_Anon_خود_را_اینجا_بگذارید';

        const { createClient } = supabase;
        const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let gameState = {
            board: Array(9).fill(null),
            currentPlayer: 'X',
            winner: null,
            mySymbol: null,
            opponentConnected: false,
            gameActive: false,
            roomId: null,
            myPlayerId: null // یک شناسه یکتا برای خودم
        };

        // تولید یک شناسه یکتا برای این بازیکن
        gameState.myPlayerId = 'player_' + Math.random().toString(36).substring(2, 9);

        const lobbyDiv = document.getElementById('lobby');
        const gameDiv = document.getElementById('game');
        const findBtn = document.getElementById('find-match-btn');
        const statusP = document.getElementById('status');
        const boardDiv = document.getElementById('board');
        const gameStatusDiv = document.getElementById('game-status');
        const turnIndicator = document.getElementById('turn-indicator');
        const restartBtn = document.getElementById('restart-btn');

        let lobbyChannel = null;
        let gameChannel = null;

        // ==========================================
        // ۱. جستجوی حریف با Broadcast (روش پایدار)
        // ==========================================
        findBtn.addEventListener('click', async () => {
            findBtn.disabled = true;
            statusP.textContent = 'وضعیت: در حال جستجوی حریف...';
            console.log('شروع جستجو با شناسه بازیکن:', gameState.myPlayerId);

            // اتصال به یک کانال عمومی برای اعلام حضور
            lobbyChannel = supabaseClient.channel('public-lobby');

            lobbyChannel
                .on('broadcast', { event: 'looking-for-game' }, (payload) => {
                    console.log('پیام جستجوی حریف دریافت شد:', payload);
                    const opponentId = payload.payload.playerId;

                    // اگر من هم در حال جستجو هستم و حریف دیگری پیدا شد
                    if (opponentId !== gameState.myPlayerId && !gameState.opponentConnected) {
                        // یک شناسه اتاق یکتا بر اساس شناسه هر دو بازیکن بساز
                        const roomName = [gameState.myPlayerId, opponentId].sort().join('-');
                        gameState.roomId = roomName;

                        console.log('حریف پیدا شد! ساخت اتاق:', roomName);

                        // به حریف اطلاع بده که اتاق ساخته شده
                        lobbyChannel.send({
                            type: 'broadcast',
                            event: 'game-room-created',
                            payload: { roomId: roomName, creatorId: gameState.myPlayerId }
                        });

                        // خودم بازی را شروع کن
                        startGame(roomName, opponentId);
                    }
                })
                .on('broadcast', { event: 'game-room-created' }, (payload) => {
                    console.log('پیام ساخت اتاق دریافت شد:', payload);
                    const { roomId, creatorId } = payload.payload;

                    // اگر من در حال جستجو هستم و این اتاق توسط حریف ساخته شده
                    if (!gameState.opponentConnected && creatorId !== gameState.myPlayerId) {
                        console.log('به اتاق ساخته شده ملحق می‌شوم:', roomId);
                        startGame(roomId, creatorId);
                    }
                })
                .subscribe((status) => {
                    console.log('وضعیت کانال لابی:', status);
                    if (status === 'SUBSCRIBED') {
                        // به محض اتصال، اعلام کن که در حال جستجوی حریف هستم
                        lobbyChannel.send({
                            type: 'broadcast',
                            event: 'looking-for-game',
                            payload: { playerId: gameState.myPlayerId }
                        });
                        console.log('پیام جستجوی حریف ارسال شد.');
                    }
                });
        });

        // ==========================================
        // ۲. شروع بازی در یک اتاق اختصاصی
        // ==========================================
        function startGame(roomId, opponentId) {
            if (gameState.opponentConnected) return;

            gameState.opponentConnected = true;
            gameState.gameActive = true;

            // تعیین نماد: بر اساس مقایسه شناسه‌ها (کسی که شناسه‌اش کوچک‌تر است X می‌شود)
            gameState.mySymbol = (gameState.myPlayerId < opponentId) ? 'X' : 'O';
            console.log('نماد من:', gameState.mySymbol);

            // بستن کانال لابی
            if (lobbyChannel) {
                lobbyChannel.unsubscribe();
                lobbyChannel = null;
            }

            // نمایش صفحه بازی
            lobbyDiv.style.display = 'none';
            gameDiv.style.display = 'block';
            boardDiv.innerHTML = '';
            gameStatusDiv.textContent = 'حریف پیدا شد!';

            for (let i = 0; i < 9; i++) {
                const cell = document.createElement('div');
                cell.classList.add('cell');
                cell.dataset.index = i;
                cell.addEventListener('click', () => handleCellClick(i));
                boardDiv.appendChild(cell);
            }

            setupGameChannel(roomId);
            resetGameState();
        }

        function resetGameState() {
            gameState.board = Array(9).fill(null);
            gameState.currentPlayer = 'X';
            gameState.winner = null;
            gameState.gameActive = true;
            updateUI();
        }

        // ==========================================
        // ۳. کانال بازی
        // ==========================================
        function setupGameChannel(roomId) {
            gameChannel = supabaseClient.channel(`game-${roomId}`);

            gameChannel
                .on('broadcast', { event: 'move' }, (payload) => {
                    const { index, symbol } = payload.payload;
                    if (symbol !== gameState.mySymbol && gameState.board[index] === null && gameState.gameActive) {
                        makeMove(index, symbol);
                    }
                })
                .on('broadcast', { event: 'restart' }, () => {
                    resetGame();
                    gameStatusDiv.textContent = 'بازی از نو شروع شد!';
                })
                .subscribe((status) => {
                    console.log('وضعیت کانال بازی:', status);
                    if (status === 'SUBSCRIBED') {
                        turnIndicator.textContent = `شما ${gameState.mySymbol} هستید`;
                        updateUI();
                    }
                });
        }

        // ==========================================
        // ۴. منطق بازی
        // ==========================================
        function handleCellClick(index) {
            if (!gameState.gameActive) return;
            if (gameState.winner) return;
            if (gameState.board[index] !== null) return;
            if (gameState.currentPlayer !== gameState.mySymbol) return;

            makeMove(index, gameState.mySymbol);

            if (gameChannel) {
                gameChannel.send({
                    type: 'broadcast',
                    event: 'move',
                    payload: { index: index, symbol: gameState.mySymbol }
                });
            }
        }

        function makeMove(index, symbol) {
            if (gameState.board[index] !== null) return;

            gameState.board[index] = symbol;
            const cell = document.querySelector(`.cell[data-index="${index}"]`);
            cell.textContent = symbol;
            cell.classList.add(symbol.toLowerCase());

            const winner = checkWinner(gameState.board);
            if (winner) {
                gameState.winner = winner;
                gameState.gameActive = false;
                gameStatusDiv.textContent = (winner === 'draw') ? 'مساوی!' : `برنده: ${winner}`;
                restartBtn.style.display = 'block';
            } else {
                gameState.currentPlayer = (gameState.currentPlayer === 'X') ? 'O' : 'X';
            }
            updateUI();
        }

        function checkWinner(board) {
            const lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
            for (let line of lines) {
                const [a,b,c] = line;
                if (board[a] && board[a] === board[b] && board[a] === board[c]) {
                    return board[a];
                }
            }
            if (board.every(cell => cell !== null)) return 'draw';
            return null;
        }

        function updateUI() {
            if (!gameState.gameActive) return;
            if (gameState.winner) return;
            turnIndicator.textContent = (gameState.currentPlayer === gameState.mySymbol) ? 'نوبت شماست' : 'نوبت حریف';
        }

        // ==========================================
        // ۵. بازی جدید
        // ==========================================
        restartBtn.addEventListener('click', () => {
            if (gameChannel) {
                gameChannel.send({ type: 'broadcast', event: 'restart', payload: {} });
            }
            resetGame();
            gameStatusDiv.textContent = 'بازی از نو شروع شد!';
        });

        function resetGame() {
            gameState.board = Array(9).fill(null);
            gameState.currentPlayer = 'X';
            gameState.winner = null;
            gameState.gameActive = true;
            restartBtn.style.display = 'none';
            document.querySelectorAll('.cell').forEach(cell => {
                cell.textContent = '';
                cell.className = 'cell';
            });
            updateUI();
        }
    </script>
</body>
    </html>
