<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بازی دوز آنلاین</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: #1a1a2e;
            color: #eee;
        }
        h1 { color: #e94560; }
        #lobby, #game { display: none; text-align: center; }
        #lobby { display: block; }
        button {
            padding: 12px 24px;
            font-size: 18px;
            cursor: pointer;
            background: #0f3460;
            color: #fff;
            border: none;
            border-radius: 8px;
            margin-top: 20px;
        }
        button:hover { background: #16213e; }
        button:disabled { background: #555; cursor: not-allowed; }
        #status { margin-top: 15px; color: #aaa; }
        
        /* استایل صفحه بازی */
        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 8px;
            background: #16213e;
            padding: 10px;
            border-radius: 12px;
            margin: 20px 0;
        }
        .cell {
            background: #0f3460;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            transition: 0.2s;
        }
        .cell:hover { background: #1a1a4e; }
        .cell.x { color: #e94560; }
        .cell.o { color: #4ecdc4; }
        #game-status { font-size: 20px; margin-bottom: 10px; height: 30px; }
        #turn-indicator { margin-bottom: 10px; color: #aaa; }
    </style>
</head>
<body>

    <h1>🎮 دوز آنلاین</h1>

    <!-- بخش لابی (جستجوی حریف) -->
    <div id="lobby">
        <p>برای پیدا کردن حریف، روی دکمه زیر کلیک کن:</p>
        <button id="find-match-btn">جستجوی حریف</button>
        <p id="status">وضعیت: آماده</p>
    </div>

    <!-- بخش بازی -->
    <div id="game">
        <div id="game-status"></div>
        <div id="turn-indicator"></div>
        <div class="board" id="board"></div>
        <button id="restart-btn" style="display:none;">بازی جدید</button>
    </div>

    <script>
        // ==========================================
        // تنظیمات Supabase (این دو مقدار را تغییر دهید)
        // ==========================================
        const SUPABASE_URL = 'آدرس_پروژه_خود_را_اینجا_بگذارید';
        const SUPABASE_ANON_KEY = 'کلید_Anon_خود_را_اینجا_بگذارید';

        // اتصال به Supabase
        const { createClient } = supabase;
        const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // وضعیت بازی
        let gameState = {
            board: Array(9).fill(null),
            currentPlayer: 'X',
            winner: null,
            mySymbol: null,
            opponentConnected: false,
            gameActive: false,
            roomId: null
        };

        // عناصر DOM
        const lobbyDiv = document.getElementById('lobby');
        const gameDiv = document.getElementById('game');
        const findBtn = document.getElementById('find-match-btn');
        const statusP = document.getElementById('status');
        const boardDiv = document.getElementById('board');
        const gameStatusDiv = document.getElementById('game-status');
        const turnIndicator = document.getElementById('turn-indicator');
        const restartBtn = document.getElementById('restart-btn');

        let channel = null;

        // ==========================================
        // ۱. جستجوی حریف (Matchmaking)
        // ==========================================
        findBtn.addEventListener('click', async () => {
            findBtn.disabled = true;
            statusP.textContent = 'وضعیت: در حال جستجوی حریف...';

            // استفاده از یک کانال عمومی برای لابی
            channel = supabaseClient.channel('matchmaking-lobby', {
                config: {
                    presence: { key: crypto.randomUUID() } // شناسه یکتا برای این بازیکن
                }
            });

            // گوش دادن به حضور بازیکنان دیگر در لابی
            channel
                .on('presence', { event: 'sync' }, () => {
                    const state = channel.presenceState();
                    const players = Object.keys(state);

                    // اگر بازیکن دیگری غیر از خودم در لابی هست، چالش را شروع کن
                    // (من اولین نفر هستم که دکمه را زدم، پس منتظر می‌مانم)
                    if (players.length >= 2 && !gameState.opponentConnected) {
                        // به بازیکن دیگر اطلاع بده که حریف پیدا شد
                        const opponentId = players.find(id => id !== channel.presenceKey);
                        
                        // ما یک اتاق خصوصی برای این دو نفر می‌سازیم
                        // شناسه اتاق را از ترکیب شناسه دو بازیکن می‌سازیم تا برای هر دو یکسان باشد
                        const myId = channel.presenceKey;
                        const roomName = [myId, opponentId].sort().join('-');
                        gameState.roomId = roomName;
                        
                        // اعلام شروع بازی به حریف
                        channel.send({
                            type: 'broadcast',
                            event: 'game-found',
                            payload: { roomId: roomName }
                        });

                        // خودم هم وارد اتاق بازی می‌شوم
                        startGame(roomName);
                    }
                })
                .subscribe(async (status) => {
                    if (status === 'SUBSCRIBED') {
                        // خودم را در لابی ثبت می‌کنم
                        await channel.track({ online_at: new Date().toISOString() });
                    }
                });

            // گوش دادن به پیام "بازی پیدا شد" (برای بازیکن دومی که وارد لابی شده)
            channel.on('broadcast', { event: 'game-found' }, (payload) => {
                if (!gameState.opponentConnected && payload.payload.roomId) {
                    gameState.roomId = payload.payload.roomId;
                    startGame(payload.payload.roomId);
                }
            });
        });

        // ==========================================
        // ۲. شروع بازی در یک اتاق اختصاصی
        // ==========================================
        function startGame(roomId) {
            if (gameState.opponentConnected) return; // اگر قبلاً شروع شده، دوباره اجرا نشود
            
            gameState.opponentConnected = true;
            gameState.gameActive = true;
            
            // اگر من درخواست‌کننده بوده‌ام (اولین نفر در لابی)، نماد X را می‌گیرم
            // (منطق ساده: کسی که roomId را ساخته، X می‌شود)
            const myId = channel.presenceKey;
            const firstPlayerId = roomId.split('-')[0]; // چون sort شده، کوچک‌تر اول است
            gameState.mySymbol = (myId === firstPlayerId) ? 'X' : 'O';
            
            // قطع اتصال از کانال لابی
            if (channel) {
                channel.unsubscribe();
            }

            // نمایش صفحه بازی
            lobbyDiv.style.display = 'none';
            gameDiv.style.display = 'block';
            boardDiv.innerHTML = '';
            
            // ساخت صفحه دوز
            for (let i = 0; i < 9; i++) {
                const cell = document.createElement('div');
                cell.classList.add('cell');
                cell.dataset.index = i;
                cell.addEventListener('click', () => handleCellClick(i));
                boardDiv.appendChild(cell);
            }

            // اتصال به اتاق بازی (کانال خصوصی)
            setupGameChannel(roomId);

            // تنظیم وضعیت اولیه
            gameState.board = Array(9).fill(null);
            gameState.currentPlayer = 'X';
            gameState.winner = null;
            updateUI();
            gameStatusDiv.textContent = 'حریف پیدا شد!';
        }

        // ==========================================
        // ۳. مدیریت کانال بازی
        // ==========================================
        function setupGameChannel(roomId) {
            const gameChannel = supabaseClient.channel(`game-${roomId}`, {
                config: {
                    presence: { key: channel.presenceKey } // شناسه خودم را نگه می‌دارم
                }
            });

            // گوش دادن به حرکات حریف
            gameChannel
                .on('broadcast', { event: 'move' }, (payload) => {
                    const { index, symbol } = payload.payload;
                    // فقط اگر نوبت حریف بود و خانه خالی بود، حرکت را اعمال کن
                    if (symbol !== gameState.mySymbol && gameState.board[index] === null && gameState.gameActive) {
                        makeMove(index, symbol);
                    }
                })
                .on('broadcast', { event: 'restart' }, () => {
                    resetGame();
                    gameStatusDiv.textContent = 'بازی از نو شروع شد!';
                })
                .on('presence', { event: 'sync' }, () => {
                    // اگر حریف قطع شد، بازی را متوقف کن
                    const state = gameChannel.presenceState();
                    const players = Object.keys(state);
                    if (players.length < 2 && gameState.gameActive) {
                        gameStatusDiv.textContent = 'حریف خارج شد!';
                        gameState.gameActive = false;
                        restartBtn.style.display = 'block';
                    }
                })
                .subscribe(async (status) => {
                    if (status === 'SUBSCRIBED') {
                        // به اتاق بپیوند
                        await gameChannel.track({ online: true });
                        // نشان دادن نماد خودم
                        turnIndicator.textContent = `شما ${gameState.mySymbol} هستید`;
                        updateUI();
                    }
                });

            // ذخیره کانال در متغیر سراسری برای ارسال حرکت
            window.gameChannel = gameChannel;
        }

        // ==========================================
        // ۴. منطق بازی و ارسال حرکت
        // ==========================================
        function handleCellClick(index) {
            if (!gameState.gameActive) return;
            if (gameState.winner) return;
            if (gameState.board[index] !== null) return;
            if (gameState.currentPlayer !== gameState.mySymbol) return; // نوبت من نیست

            // انجام حرکت
            makeMove(index, gameState.mySymbol);

            // ارسال حرکت به حریف
            if (window.gameChannel) {
                window.gameChannel.send({
                    type: 'broadcast',
                    event: 'move',
                    payload: { index: index, symbol: gameState.mySymbol }
                });
            }
        }

        function makeMove(index, symbol) {
            if (gameState.board[index] !== null) return; // خانه اشغال است

            // به‌روزرسانی وضعیت
            gameState.board[index] = symbol;
            const cell = document.querySelector(`.cell[data-index="${index}"]`);
            cell.textContent = symbol;
            cell.classList.add(symbol.toLowerCase());

            // بررسی برد
            const winner = checkWinner(gameState.board);
            if (winner) {
                gameState.winner = winner;
                gameState.gameActive = false;
                gameStatusDiv.textContent = (winner === 'draw') ? 'مساوی!' : `برنده: ${winner}`;
                restartBtn.style.display = 'block';
            } else {
                // تغییر نوبت
                gameState.currentPlayer = (gameState.currentPlayer === 'X') ? 'O' : 'X';
            }
            updateUI();
        }

        function checkWinner(board) {
            const lines = [
                [0,1,2],[3,4,5],[6,7,8], // سطرها
                [0,3,6],[1,4,7],[2,5,8], // ستون‌ها
                [0,4,8],[2,4,6]           // قطرها
            ];
            for (let line of lines) {
                const [a,b,c] = line;
                if (board[a] && board[a] === board[b] && board[a] === board[c]) {
                    return board[a];
                }
            }
            if (board.every(cell => cell !== null)) return 'draw';
            return null;
        }

        function updateUI() {
            if (!gameState.gameActive) return;
            if (gameState.winner) return;

            if (gameState.currentPlayer === gameState.mySymbol) {
                turnIndicator.textContent = 'نوبت شماست';
            } else {
                turnIndicator.textContent = 'نوبت حریف';
            }
        }

        // ==========================================
        // ۵. درخواست بازی جدید
        // ==========================================
        restartBtn.addEventListener('click', () => {
            // ارسال درخواست ریست به حریف
            if (window.gameChannel) {
                window.gameChannel.send({
                    type: 'broadcast',
                    event: 'restart',
                    payload: {}
                });
            }
            resetGame();
            gameStatusDiv.textContent = 'بازی از نو شروع شد!';
        });

        function resetGame() {
            gameState.board = Array(9).fill(null);
            gameState.currentPlayer = 'X';
            gameState.winner = null;
            gameState.gameActive = true;
            restartBtn.style.display = 'none';
            
            document.querySelectorAll('.cell').forEach(cell => {
                cell.textContent = '';
                cell.className = 'cell';
            });
            updateUI();
        }
    </script>
</body>
</html>
